# =============================================================================
# CD Workflow - Deploy Infrastructure and Application
# =============================================================================
# Triggers:
#   - Successful CI workflow on main branch
#   - Manual workflow dispatch
#
# Steps:
#   1. Authenticate to Azure using OIDC
#   2. Deploy Bicep infrastructure
#   3. Update Container App with new image
#   4. Inject secrets from Key Vault
#   5. Verify health probes
#   6. Run smoke tests
# =============================================================================

name: CD - Deploy to Azure

on:
  workflow_run:
    workflows: ["CI - Build and Test"]
    types:
      - completed
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: 'Environment to deploy to'
        required: true
        type: choice
        options:
          - dev
          - staging
          - prod
        default: 'dev'

# Required for OIDC authentication
permissions:
  id-token: write
  contents: read
  deployments: write

env:
  AZURE_RESOURCE_GROUP: '' # Set via GitHub variables
  BICEP_FILE: 'iac/main.bicep'
  PARAMETERS_FILE: 'iac/parameters.json'
  IMAGE_NAME: 'mcp-server'

jobs:
  # ===========================================================================
  # Deploy Infrastructure Job
  # ===========================================================================
  deploy-infrastructure:
    name: Deploy Infrastructure
    runs-on: ubuntu-latest
    # Only run if CI workflow succeeded or manual trigger
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}
    outputs:
      container-app-name: ${{ steps.deploy.outputs.containerAppName }}
      acr-name: ${{ steps.deploy.outputs.acrName }}
      key-vault-name: ${{ steps.deploy.outputs.keyVaultName }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Create resource group if not exists
        run: |
          az group create \
            --name ${{ vars.AZURE_RESOURCE_GROUP }} \
            --location ${{ vars.AZURE_REGION }}

      - name: Validate Bicep template
        run: |
          az deployment group validate \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.PARAMETERS_FILE }} \
            --parameters environment=${{ github.event.inputs.environment || 'dev' }} \
            --parameters baseName=${{ vars.BASE_NAME }} \
            --parameters sqlAdminUsername=${{ secrets.SQL_ADMIN_USERNAME }} \
            --parameters sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }} \
            --parameters mcpServerImage=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}

      - name: Deploy Bicep template
        id: deploy
        run: |
          deployment_output=$(az deployment group create \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --template-file ${{ env.BICEP_FILE }} \
            --parameters ${{ env.PARAMETERS_FILE }} \
            --parameters environment=${{ github.event.inputs.environment || 'dev' }} \
            --parameters baseName=${{ vars.BASE_NAME }} \
            --parameters sqlAdminUsername=${{ secrets.SQL_ADMIN_USERNAME }} \
            --parameters sqlAdminPassword=${{ secrets.SQL_ADMIN_PASSWORD }} \
            --parameters mcpServerImage=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            --output json)

          echo "containerAppName=$(echo $deployment_output | jq -r '.properties.outputs.containerAppName.value')" >> $GITHUB_OUTPUT
          echo "acrName=$(echo $deployment_output | jq -r '.properties.outputs.acrName.value')" >> $GITHUB_OUTPUT
          echo "keyVaultName=$(echo $deployment_output | jq -r '.properties.outputs.keyVaultName.value')" >> $GITHUB_OUTPUT

      - name: Display deployment outputs
        run: |
          echo "Container App Name: ${{ steps.deploy.outputs.containerAppName }}"
          echo "ACR Name: ${{ steps.deploy.outputs.acrName }}"
          echo "Key Vault Name: ${{ steps.deploy.outputs.keyVaultName }}"

  # ===========================================================================
  # Update Container App Job
  # ===========================================================================
  update-container-app:
    name: Update Container App
    runs-on: ubuntu-latest
    needs: deploy-infrastructure
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Log in to Azure using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get latest image tag
        id: image
        run: |
          # Use SHA from main branch or manual input
          IMAGE_TAG="${{ github.sha }}"
          echo "tag=${IMAGE_TAG}" >> $GITHUB_OUTPUT
          echo "fullImage=${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${IMAGE_TAG}" >> $GITHUB_OUTPUT

      - name: Update Container App image
        run: |
          az containerapp update \
            --name ${{ needs.deploy-infrastructure.outputs.container-app-name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --image ${{ steps.image.outputs.fullImage }} \
            --output table

      - name: Wait for revision to be ready
        run: |
          echo "Waiting for new revision to be ready..."
          timeout=300
          elapsed=0
          interval=10

          while [ $elapsed -lt $timeout ]; do
            state=$(az containerapp revision list \
              --name ${{ needs.deploy-infrastructure.outputs.container-app-name }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --query "[0].properties.runningState" -o tsv)

            if [ "$state" == "Running" ]; then
              echo "✓ Revision is running"
              exit 0
            fi

            echo "Current state: $state (${elapsed}s elapsed)"
            sleep $interval
            elapsed=$((elapsed + interval))
          done

          echo "✗ Timeout waiting for revision to be ready"
          exit 1

  # ===========================================================================
  # Health Check and Smoke Tests Job
  # ===========================================================================
  health-check:
    name: Health Check and Smoke Tests
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, update-container-app]
    environment:
      name: ${{ github.event.inputs.environment || 'dev' }}

    steps:
      - name: Log in to Azure using OIDC
        uses: azure/login@v1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Get Container App FQDN
        id: fqdn
        run: |
          fqdn=$(az containerapp show \
            --name ${{ needs.deploy-infrastructure.outputs.container-app-name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --query "properties.configuration.ingress.fqdn" -o tsv)
          echo "fqdn=${fqdn}" >> $GITHUB_OUTPUT
          echo "Container App FQDN: ${fqdn}"

      - name: Check health endpoint
        run: |
          echo "Checking health endpoint..."
          # Note: Container App has internal ingress, so this requires VPN/bastion access
          # In production, use Azure Container Instance or bastion for health checks
          echo "Health check URL: https://${{ steps.fqdn.outputs.fqdn }}/health"
          echo "⚠️  Health check requires VNet access (internal ingress)"

      - name: Check Container App logs
        run: |
          echo "Fetching recent logs..."
          az containerapp logs show \
            --name ${{ needs.deploy-infrastructure.outputs.container-app-name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --tail 50 \
            --follow false

      - name: Check for errors in logs
        run: |
          errors=$(az containerapp logs show \
            --name ${{ needs.deploy-infrastructure.outputs.container-app-name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --tail 100 \
            --follow false \
            | grep -i "error" || true)

          if [ -n "$errors" ]; then
            echo "⚠️  Errors found in logs:"
            echo "$errors"
            exit 1
          else
            echo "✓ No errors found in recent logs"
          fi

      - name: Verify replica count
        run: |
          replicas=$(az containerapp revision show \
            --name ${{ needs.deploy-infrastructure.outputs.container-app-name }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
            --revision $(az containerapp revision list \
              --name ${{ needs.deploy-infrastructure.outputs.container-app-name }} \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP }} \
              --query "[0].name" -o tsv) \
            --query "properties.replicas" -o tsv)

          echo "Current replicas: $replicas"

          if [ "$replicas" -lt 1 ]; then
            echo "✗ No replicas running"
            exit 1
          else
            echo "✓ $replicas replica(s) running"
          fi

  # ===========================================================================
  # Deployment Summary Job
  # ===========================================================================
  summary:
    name: Deployment Summary
    runs-on: ubuntu-latest
    needs: [deploy-infrastructure, update-container-app, health-check]
    if: always()

    steps:
      - name: Create deployment summary
        run: |
          echo "## Deployment Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Environment:** ${{ github.event.inputs.environment || 'dev' }}" >> $GITHUB_STEP_SUMMARY
          echo "**Resource Group:** ${{ vars.AZURE_RESOURCE_GROUP }}" >> $GITHUB_STEP_SUMMARY
          echo "**Container App:** ${{ needs.deploy-infrastructure.outputs.container-app-name }}" >> $GITHUB_STEP_SUMMARY
          echo "**Image:** ${{ vars.ACR_NAME }}.azurecr.io/${{ env.IMAGE_NAME }}:${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job Status" >> $GITHUB_STEP_SUMMARY
          echo "- Infrastructure: ${{ needs.deploy-infrastructure.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Container App: ${{ needs.update-container-app.result }}" >> $GITHUB_STEP_SUMMARY
          echo "- Health Check: ${{ needs.health-check.result }}" >> $GITHUB_STEP_SUMMARY

      - name: Fail if any job failed
        if: |
          needs.deploy-infrastructure.result == 'failure' ||
          needs.update-container-app.result == 'failure' ||
          needs.health-check.result == 'failure'
        run: exit 1
